services:
  mail-harbor:
    build: .
    image: stylle/mail-harbor:v0.2.3
    ports: ["28187:8080"]
    # Change this mount once; the one-shot initializer uses the exact same mount.
    volumes: &mail-data ["mail-harbor-data:/data"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  # Runs to completion before the mail service. No network, ports or API;
  # adjusts ownership only for /data and its four known key/SQLite files.
  # The mail service above retains cap_drop ALL and UID10001.
  data-init:
    image: stylle/mail-harbor:v0.2.3
    user: "0:0"
    entrypoint: ["/usr/local/bin/data-init"]
    volumes: *mail-data
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
volumes:
  mail-harbor-data:
