services:
  mail-harbor:
    build: .
    image: stylle/mail-harbor:v0.2.5
    ports: ["28187:8080"]
    volumes: ["mail-harbor-data:/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    # Required only by the startup bootstrap. The API executes as UID10001
    # with zero permitted/effective capabilities and no_new_privs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
volumes:
  mail-harbor-data:
